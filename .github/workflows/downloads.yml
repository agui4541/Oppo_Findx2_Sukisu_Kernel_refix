name: Warm toolchains cache (clang-r383902 + gcc-4.9)

on:
  workflow_dispatch:

concurrency:
  group: toolchains-warm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Official AOSP clang archive (Android 11 r3, clang-r383902)
  AOSP_CLANG_URL: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r3/clang-r383902.tar.gz"

  # GCC 4.9 toolchains (LineageOS mirrors)
  GCC64_REPO: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
  GCC32_REPO: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"

jobs:
  warm:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout (not strictly required, but keeps workspace consistent)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install minimal deps
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl file git gzip tar xz-utils
          git --version

      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: toolchains
          key: toolchains-${{ runner.os }}-aosp-clang-r383902-gcc49-v3

      - name: Download toolchains if missing
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/toolchains"
          cd "$GITHUB_WORKSPACE/toolchains"

          if [[ ! -d clang-r383902 ]]; then
            echo "Downloading AOSP clang-r383902..."
            http_code="$(curl -L -sS -w "%{http_code}" -o clang-r383902.tar.gz "${AOSP_CLANG_URL}" || true)"
            echo "HTTP: $http_code"
            ls -lh clang-r383902.tar.gz || true

            if [[ "$http_code" != "200" ]]; then
              echo "[ERROR] clang download failed (HTTP $http_code). First 200 bytes:"
              head -c 200 clang-r383902.tar.gz || true
              echo
              exit 1
            fi

            file clang-r383902.tar.gz || true
            gzip -t clang-r383902.tar.gz

            mkdir -p clang-r383902
            tar -xzf clang-r383902.tar.gz -C clang-r383902
            rm -f clang-r383902.tar.gz
          else
            echo "[OK] clang-r383902 already present"
          fi

          if [[ ! -d aarch64-linux-android-4.9 ]]; then
            echo "Cloning gcc64..."
            git clone --depth=1 "${GCC64_REPO}" aarch64-linux-android-4.9
          else
            echo "[OK] gcc64 already present"
          fi

          if [[ ! -d arm-linux-androideabi-4.9 ]]; then
            echo "Cloning gcc32..."
            git clone --depth=1 "${GCC32_REPO}" arm-linux-androideabi-4.9
          else
            echo "[OK] gcc32 already present"
          fi

          echo "=== Toolchains directory size ==="
          du -sh ./* || true

          echo "=== clang version ==="
          "$GITHUB_WORKSPACE/toolchains/clang-r383902/bin/clang" --version || true

          echo "=== gcc versions ==="
          "$GITHUB_WORKSPACE/toolchains/aarch64-linux-android-4.9/bin/aarch64-linux-android-gcc" --version | head -n 1 || true
          "$GITHUB_WORKSPACE/toolchains/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-gcc" --version | head -n 1 || true

      - name: Done (cache will be saved at job end)
        shell: bash
        run: |
          echo "Toolchains warmed. Subsequent build workflows should hit the toolchains cache."
