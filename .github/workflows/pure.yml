name: Build Oppo Find X2 Kernel with AnyKernel3 (LLVM + Binutils)

on:
  workflow_dispatch: # 允许你在 GitHub 网页上手动运行
    inputs:
      jobs:
        description: "Parallel jobs (make -jN)"
        required: true
        default: "16"

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out
  DEFCONFIG: stock_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: recursive

    - name: Install Dependencies and Setup Python
      run: |
        sudo apt-get update
        # 安装现代 LLVM 工具链 (llvm, clang, lld) 和必要的构建依赖
        # Ubuntu 22.04 的仓库通常包含较新版本的 LLVM 工具链
        sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libdevmapper-dev python3 libtinfo-dev wget ccache rsync zip python2 llvm clang lld
        # 确保 python 指向 python2 (以防万一有脚本需要)
        sudo ln -sf /usr/bin/python2 /usr/bin/python
        python -V
        python2 -V
        clang --version
        lld --version

    # --- 验证内核树布局 ---
    - name: Verify kernel tree layout
      shell: bash
      run: |
        set -euxo pipefail
        test -d drivers
        test -d arch
        test -f "arch/arm64/configs/${{ env.DEFCONFIG }}"
        echo "[OK] kernel root + defconfig OK"

    # --- 清理输出目录 ---
    - name: Clean output dir (mrproper)
      shell: bash
      run: |
        set -euxo pipefail
        make O="${{ env.OUT_DIR }}" mrproper
        mkdir -p "${{ env.OUT_DIR }}"

    # --- 配置内核 (使用 LLVM + Binutils 环境变量) ---
    - name: Configure kernel (stock_defconfig + olddefconfig)
      shell: bash
      run: |
        set -euxo pipefail
        export ARCH="${{ env.ARCH }}"
        export SUBARCH="${{ env.SUBARCH }}"

        # 使用 LLVM + Binutils
        export CC=clang
        export LD=ld.lld # 指定 LLVM 的 lld 作为链接器
        # 一些内核构建脚本可能仍需要 GCC 工具链中的某些工具 (如 as, objcopy)，但由 clang 驱动
        # 使用标准 GNU 前缀，Clang 会尝试调用 aarch64-linux-gnu-<tool>
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        # 如果构建系统明确寻找 32 位工具，也需要设置
        # export CROSS_COMPILE_ARM32=arm-linux-gnueabi- # 或者 aarch64-linux-gnu- 如果它也提供 32 位工具

        # 应用 defconfig
        make O="${{ env.OUT_DIR }}" "${{ env.DEFCONFIG }}"

        # Best-effort config tweaks to "just build":
        if [[ -x scripts/config ]]; then
          scripts/config --file "${{ env.OUT_DIR }}/.config" -d WERROR || true
          scripts/config --file "${{ env.OUT_DIR }}/.config" -d FORTIFY_SOURCE || true
          scripts/config --file "${{ env.OUT_DIR }}/.config" -d CC_HAS_FORTIFY_SOURCE || true
          scripts/config --file "${{ env.OUT_DIR }}/.config" -d LTO -d LTO_CLANG -d THINLTO || true
        fi

        # 使用 olddefconfig 解决潜在的配置不一致问题
        make O="${{ env.OUT_DIR }}" olddefconfig

        echo "=== Show important config (after configure) ==="
        grep -nE "^(CONFIG_WERROR|CONFIG_FORTIFY|CONFIG_KPROBES|CONFIG_KALLSYMS|CONFIG_LTO|CONFIG_THINLTO)" "${{ env.OUT_DIR }}/.config" || true

    # --- 编译内核 (使用 LLVM + Binutils) ---
    - name: Build Kernel
      shell: bash
      run: |
        set -euxo pipefail
        export ARCH="${{ env.ARCH }}"
        export SUBARCH="${{ env.SUBARCH }}"

        # 再次设置编译器和交叉编译前缀
        export CC=clang
        export LD=ld.lld # 确保链接器是 lld
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-

        # 使用输入的并行任务数
        jobs=${{ github.event.inputs.jobs || '16' }}

        # 尝试使用 LLVM + Binutils 编译
        # 添加 WERROR=0 和 -Wno-error 作为额外保险，防止 "forbidden warning"
        make -j"$jobs" O="${{ env.OUT_DIR }}" \
          WERROR=0 \
          KCFLAGS="-Wno-error" \
          KBUILD_CFLAGS="-Wno-error" \
          HOSTCFLAGS="-Wno-error" \
          HOSTLDFLAGS="" \
          Image 2>&1 | tee build.log

        # 可选：编译 Image.gz
        make -j"$jobs" O="${{ env.OUT_DIR }}" \
          WERROR=0 \
          KCFLAGS="-Wno-error" \
          KBUILD_CFLAGS="-Wno-error" \
          HOSTCFLAGS="-Wno-error" \
          HOSTLDFLAGS="" \
          Image.gz 2>&1 | tee -a build.log || true

        echo "Kernel build complete (or failed after logging)."

    # --- 收集原始产物 ---
    - name: Collect artifacts (raw outputs)
      shell: bash
      run: |
        set -euxo pipefail
        mkdir -p dist

        BOOT_DIR="${{ env.OUT_DIR }}/arch/arm64/boot"
        test -d "${BOOT_DIR}"

        if [[ ! -f "${BOOT_DIR}/Image" ]]; then
          echo "[ERROR] out/arch/arm64/boot/Image not found." >&2
          echo "Available files under boot dir:" >&2
          ls -la "${BOOT_DIR}" >&2 || true
          exit 1
        fi

        cp -v "${BOOT_DIR}/Image" dist/Image

        for f in Image.gz Image.gz-dtb Image.lz4 Image.lz4-dtb; do
          if [[ -f "${BOOT_DIR}/${f}" ]]; then
            cp -v "${BOOT_DIR}/${f}" "dist/${f}"
          fi
        done

        [[ -f "${{ env.OUT_DIR }}/vmlinux" ]] && cp -v "${{ env.OUT_DIR }}/vmlinux" dist/vmlinux || true
        [[ -f "${{ env.OUT_DIR }}/System.map" ]] && cp -v "${{ env.OUT_DIR }}/System.map" dist/System.map || true

        cp -v "${{ env.OUT_DIR }}/.config" dist/kernel.config
        cp -v build.log dist/build.log

        {
          echo "repo: $GITHUB_REPOSITORY"
          echo "ref: $GITHUB_REF"
          echo "sha: $GITHUB_SHA"
          echo "date_utc: $(date -u +%F_%T)"
          echo "clang: $(clang --version | head -n 1 || true)"
          echo "ld: $(ld.lld --version | head -n 1 || true)"
        } | tee dist/build-info.txt

        ls -la dist

    # --- 上传原始编译产物 ---
    - name: Upload Raw Kernel Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Raw-Compiled-Kernel-LLVM-Binutils-${{ github.sha }}
        path: dist/*

    # --- 以下步骤与之前相同，用于 AnyKernel3 打包 ---
    - name: Download AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
        cd AnyKernel3
        rm -f .gitattributes README.md

    - name: Copy Kernel Image to AnyKernel3
      run: |
        if [ -f dist/Image ]; then
            echo "Found Image, copying to AnyKernel3..."
            cp dist/Image AnyKernel3/
        elif [ -f dist/Image.gz ]; then
            echo "Found Image.gz, copying to AnyKernel3..."
            cp dist/Image.gz AnyKernel3/
        else
            echo "ERROR: Kernel image (Image or Image.gz) not found in dist/!"
            ls -la dist/
            exit 1
        fi

    - name: Configure AnyKernel3
      run: |
        cd AnyKernel3
        # --- 重要：你需要根据你的 Find X2 设备信息修改以下变量 ---
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh # 临时设为 0，或者替换为你的设备名
        sed -i 's/kernel.string=.*/kernel.string=Oppo Find X2 Kernel - Compiled with GitHub Actions (LLVM + Binutils)/g' anykernel.sh
        sed -i 's/BLOCK=.*/BLOCK=\/dev\/block\/by-name\/boot;/g' anykernel.sh # 根据 Find X2 实际路径修改
        sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=0;/g' anykernel.sh # 根据 Find X2 实际情况修改
        sed -i 's/RAMDISK_COMPRESSION=.*/RAMDISK_COMPRESSION=auto;/g' anykernel.sh
        # --- 以上是需要你根据实际情况修改的关键部分 ---
        echo "AnyKernel3 configured."

    - name: Package as Flashable ZIP
      run: |
        cd AnyKernel3
        zip -r9 "OppoFindX2-Kernel-LLVM-Binutils-${{ github.sha }}.zip" * -x ".git*" "README.md" "placeholder"
        echo "Flashable ZIP created."

    - name: Upload Flashable ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Flashable-Kernel-LLVM-Binutils-ZIP-${{ github.sha }}
        path: AnyKernel3/OppoFindX2-Kernel-LLVM-Binutils-${{ github.sha }}.zip
