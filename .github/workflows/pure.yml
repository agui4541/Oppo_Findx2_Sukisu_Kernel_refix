name: Build Pure Kernel (Verify Environment)

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "编译线程数 (默认16)"
        required: true
        default: "16"

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: stock_defconfig
  OUT_DIR: out
  # 工具链地址
  AOSP_CLANG_URL: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r3/clang-r383902.tar.gz"
  GCC64_REPO: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
  GCC32_REPO: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev python2 python3 rsync ccache zip
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      # --- 工具链缓存 (与之前报错的 Workflow 逻辑一致) ---
      - name: Cache Toolchains
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchains
          key: toolchains-r383902-gcc49-v1

      - name: Download Toolchains
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains
          cd toolchains
          curl -L ${AOSP_CLANG_URL} | tar -xz -C . # 直接解压到当前目录
          git clone --depth=1 ${GCC64_REPO} gcc64
          git clone --depth=1 ${GCC32_REPO} gcc32

      - name: Setup Paths
        run: |
          # 设置 Clang 和 GCC 的环境变量
          echo "$GITHUB_WORKSPACE/toolchains/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/toolchains/gcc64/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/toolchains/gcc32/bin" >> $GITHUB_PATH

      # --- 解决 "forbidden warning" 的核心步骤 ---
      - name: Remove Forbidden Warnings
        run: |
          # 针对 OPPO/Qualcomm 源码中 techpack 报错的精准打击
          echo "Disabling Werror globally..."
          find . -type f -name "Makefile" -o -name "Kbuild" -o -name "*.mk" | xargs sed -i 's/-Werror//g'
          find . -type f -name "Makefile" -o -name "Kbuild" -o -name "*.mk" | xargs sed -i 's/-Wforbidden-warning//g'
          # 额外针对 techpack/audio 的处理
          find techpack/ -type f -name "*.mk" | xargs sed -i 's/WERROR := 1/WERROR := 0/g' || true

      - name: Configure Kernel
        run: |
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          
          # 生成配置
          make O=${OUT_DIR} ARCH=arm64 CC=clang ${DEFCONFIG}
          
          # 如果 stock_defconfig 缺少 KPROBES (KernelSU 必需)，在此处补充验证
          # 暂时保持纯净，不做修改

      - name: Build Kernel
        run: |
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          
          # 使用所有编译优化参数
          make -j${{ github.event.inputs.jobs }} O=${OUT_DIR} \
            ARCH=arm64 \
            CC=clang \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            KCFLAGS="-Wno-error" \
            Image.gz-dtb 2>&1 | tee build_raw.log

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pure-Kernel-Result
          path: |
            ${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz-dtb
            ${{ env.OUT_DIR }}/.config
            build_raw.log
