name: Build Oppo Find X2 Kernel with AnyKernel3 (LLVM)

on:
  workflow_dispatch: # 允许你在 GitHub 网页上手动运行
  # push:
  #   branches: [ build ] # 或者当推送到 'build' 分支时自动运行

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libdevmapper-dev python3 libtinfo-dev wget ccache rsync zip python2

    - name: Setup Toolchains (LLVM + Binutils + GCC for libgcc)
      run: |
        mkdir -p toolchains

        # 1. Download a modern LLVM prebuilt (e.g., from github.com/llvm/llvm-project/releases or a community build)
        # Using a community build like https://github.com/ClangBuiltLinux/llvm-prebuilt
        # This repo provides recent LLVM builds with binutils
        echo "Downloading LLVM prebuilt..."
        # Example: Using a specific version, adjust URL as needed
        # wget -O toolchains/llvm.tar.xz https://github.com/ClangBuiltLinux/llvm-prebuilt/releases/download/2024010807/llvm-2024010807.tar.xz
        # For now, let's try the same Clang r383902b1 but ensure we use it as the primary compiler
        # And also get binutils (usually included in the Clang package or available separately)
        # The qssn70/clang-r383902b1 might already include binutils, let's assume it does.
        # We also need GCC for libgcc.a
        echo "Downloading GCC 4.9 for libgcc..."
        wget -O toolchains/gcc49.tar.gz https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/archive/refs/heads/cm-14.1.tar.gz
        tar -xf toolchains/gcc49.tar.gz -C toolchains/
        mv toolchains/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9-* toolchains/aarch64-linux-android-4.9
        echo "GCC 4.9 download and extraction complete."

        # Use the Clang from qssn70 (r383902b1)
        git clone --depth=1 https://github.com/qssn70/clang-r383902b1.git toolchains/clang-r383902b1
        echo "Clang r383902b1 download complete."

        # 2. Set environment variables for LLVM + Binutils + GCC setup
        # Add Clang and GCC bin directories to PATH
        echo "PATH=$PWD/toolchains/clang-r383902b1/bin:$PWD/toolchains/aarch64-linux-android-4.9/bin:$PATH" >> $GITHUB_ENV
        # Set ARCH
        echo "ARCH=arm64" >> $GITHUB_ENV
        # Set CROSS_COMPILE to standard GNU prefix for Clang
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        # Set CLANG_TRIPLE
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        # Set HOST_PYTHON for scripts
        echo "HOST_PYTHON=python2" >> $GITHUB_ENV
        echo "PYTHON=python2" >> $GITHUB_ENV

        echo "LLVM + Binutils + GCC setup complete."

    - name: Apply Defconfig with LLVM
      run: |
        mkdir -p out
        ls arch/arm64/configs/ # List configs
        # Apply defconfig using LLVM tools, still pass HOST_PYTHON
        make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- HOST_PYTHON=python2 PYTHON=python2 stock_defconfig
        echo "Defconfig applied (LLVM)."

    - name: Build Kernel with LLVM + Binutils + GCC libgcc
      run: |
        # Build using Clang as CC, LLD as LD, and potentially GCC's libgcc
        # The aarch64-linux-gnu-ld.lld should be picked up from PATH
        # The aarch64-linux-gnu-gcc (for libgcc) should be picked up from PATH
        make O=out -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- CC=clang LD=ld.lld HOST_PYTHON=python2 PYTHON=python2
        echo "Kernel build complete (LLVM + Binutils + GCC)."

    # --- 新增步骤：上传原始编译产物 ---
    - name: Upload Raw Kernel Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Raw-Compiled-Kernel-${{ github.sha }}
        path: out/arch/arm64/boot/Image*

    # --- 以下步骤与之前相同，用于 AnyKernel3 打包 ---
    - name: Download AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
        cd AnyKernel3
        rm -f .gitattributes README.md

    - name: Copy Kernel Image to AnyKernel3
      run: |
        if [ -f out/arch/arm64/boot/Image ]; then
            echo "Found Image, copying to AnyKernel3..."
            cp out/arch/arm64/boot/Image AnyKernel3/
        elif [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "Found Image.gz, copying to AnyKernel3..."
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
        else
            echo "ERROR: Kernel image (Image or Image.gz) not found in out/arch/arm64/boot/!"
            ls -la out/arch/arm64/boot/
            exit 1
        fi

    - name: Configure AnyKernel3
      run: |
        cd AnyKernel3
        # --- 重要：你需要根据你的 Find X2 设备信息修改以下变量 ---
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh # 临时设为 0，或者替换为你的设备名
        sed -i 's/kernel.string=.*/kernel.string=Oppo Find X2 Kernel - Compiled with GitHub Actions (LLVM)/g' anykernel.sh
        sed -i 's/BLOCK=.*/BLOCK=\/dev\/block\/by-name\/boot;/g' anykernel.sh # 根据 Find X2 实际路径修改
        sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=0;/g' anykernel.sh # 根据 Find X2 实际情况修改
        sed -i 's/RAMDISK_COMPRESSION=.*/RAMDISK_COMPRESSION=auto;/g' anykernel.sh
        # --- 以上是需要你根据实际情况修改的关键部分 ---
        echo "AnyKernel3 configured."

    - name: Package as Flashable ZIP
      run: |
        cd AnyKernel3
        zip -r9 "OppoFindX2-Kernel-LLVM-${{ github.sha }}.zip" * -x ".git*" "README.md" "placeholder"
        echo "Flashable ZIP created."

    - name: Upload Flashable ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Flashable-Kernel-LLVM-ZIP-${{ github.sha }}
        path: AnyKernel3/OppoFindX2-Kernel-LLVM-${{ github.sha }}.zip
