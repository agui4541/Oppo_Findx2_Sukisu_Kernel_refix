name: Build Kernel for OPPO FindX2 (SUSFS + Horizon Clang)

on:
  workflow_dispatch: # 手动触发

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出内核源码
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: 安装基础编译依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential cpio flex libelf-dev libssl-dev \
          git kmod libncurses5-dev lz4 python3 wget xz-utils \
          make file
        echo "基础依赖安装完成。"

    - name: 下载 Horizon Clang 工具链
      run: |
        mkdir -p ${{ github.workspace }}/toolchains
        cd ${{ github.workspace }}/toolchains
        
        # 从 GitHub Releases 下载 Horizon Clang (网络更可靠)
        # 这里是 v18.1.5 版本，你也可以替换为更新的版本
        wget -q --show-progress https://github.com/Horizon-Devices/Horizon-Clang/archive/refs/tags/v18.1.5.tar.gz -O horizon-clang.tar.gz
        tar -xf horizon-clang.tar.gz
        # 解压后的目录名通常是 Horizon-Clang-18.1.5，但可能因版本变化，建议用通配符或 ls 确认
        echo "CLANG_PATH=${{ github.workspace }}/toolchains/$(ls -d Horizon-Clang-*)/bin" >> $GITHUB_ENV
        echo "Horizon Clang 工具链已下载，路径: ${{ github.workspace }}/toolchains/$(ls -d Horizon-Clang-*)/bin"
        
        # 【备用选项】如果上面失败，可以尝试下载质子 Clang，取消下面几行的注释并注释掉上面的wget/tar/echo命令
        # wget -q --show-progress https://github.com/kdrag0n/proton-clang/archive/refs/tags/20241015.tar.gz -O proton-clang.tar.gz
        # tar -xf proton-clang.tar.gz
        # echo "CLANG_PATH=${{ github.workspace }}/toolchains/proton-clang-20241015/bin" >> $GITHUB_ENV
        # echo "质子 Clang 工具链已下载。"

    - name: 集成 SukiSU 与 SUSFS
      run: |
        cd ${{ github.workspace }}
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
        echo "SukiSU 与 SUSFS 集成完成。"

    - name: 配置内核
      env:
        ARCH: arm64
      run: |
        cd ${{ github.workspace }}
        # 关键：这里使用你的配置文件 stock_defconfig
        make stock_defconfig
        echo "内核配置完成。"
        # 可选：检查关键配置
        echo "检查 SukiSU 相关配置:"
        grep -E "CONFIG_KPROBES=|CONFIG_OVERLAY_FS=|CONFIG_SUKI" .config || true

    - name: 使用 Clang 编译内核
      env:
        ARCH: arm64
        # 核心：将 LLVM 变量指向我们下载的 Clang 工具链的父目录
        # 构建系统会自动在该路径下查找 clang, llvm-ar 等所有工具
        LLVM: ${{ env.CLANG_PATH }}/
      run: |
        cd ${{ github.workspace }}
        echo "开始编译内核，工具链路径: $LLVM"
        make -j$(nproc) Image.gz-dtb 2>&1 | tee build.log
        echo "编译步骤执行完毕。"

    - name: 验证内核镜像
      run: |
        cd ${{ github.workspace }}
        if [ -f "arch/arm64/boot/Image.gz-dtb" ]; then
          echo "✅ 成功：内核镜像已生成。"
          ls -lh "arch/arm64/boot/Image.gz-dtb"
        else
          echo "❌ 错误：未找到内核镜像，编译可能失败。"
          echo "以下是 build.log 的最后50行："
          tail -n 50 build.log
          exit 1
        fi

    - name: 打包刷机包 (AnyKernel3)
      run: |
        cd ${{ github.workspace }}
        echo "正在打包 AnyKernel3 刷机包..."
        wget -q https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip -O AnyKernel3.zip
        unzip -qo AnyKernel3.zip
        rm -f AnyKernel3.zip
        cp arch/arm64/boot/Image.gz-dtb AnyKernel3-master/

        cat > AnyKernel3-master/anykernel.sh << 'EOF'
        #!/bin/sh
        ## AnyKernel3 Script for OPPO FindX2
        device.name1=findx2
        device.name2=OP4E79L1
        block=/dev/block/bootdevice/by-name/boot
        is_slot_device=0

        ## 核心：只刷内核，不碰 dtb/dtbo
        do.devicecheck=1
        do.dtb=0
        do.dtbo=0
        do.modules=0

        dump_boot() {
          ui_print "正在备份原启动分区..."
          dd if="${block}" of="${split_img}/boot-orig.img"
        }
        write_boot() {
          ui_print "正在刷写新内核镜像..."
          dd if="${split_img}/Image.gz-dtb" of="${block}"
        }
        . tools/ak3-core.sh
        EOF

        cd AnyKernel3-master
        zip -r9 "${{ github.workspace }}/kernel-findx2-susfs.zip" . -x ".git/*" "README.md"
        echo "✅ 刷机包已生成：kernel-findx2-susfs.zip"

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-With-SUSFS
        path: |
          ${{ github.workspace }}/arch/arm64/boot/Image.gz-dtb
          ${{ github.workspace }}/kernel-findx2-susfs.zip
          ${{ github.workspace }}/build.log
