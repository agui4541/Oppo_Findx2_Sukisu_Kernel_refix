name: Build Kernel for OPPO Find X2 (Fixed)

on:
  workflow_dispatch:
    inputs:
      kernel_defconfig:
        description: 'Kernel Defconfig'
        required: true
        default: 'stock_defconfig'

jobs:
  build:
    runs-on: ubuntu-20.04
    
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CI: "false"

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v3
      with:
        fetch-depth: 1

    - name: Setup Build Environment (Fix Python & Deps)
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2
        
        # === 关键修复：强制设置 python 命令指向 python2 ===
        sudo ln -sf /usr/bin/python2 /usr/bin/python
        
        # 验证 python 版本
        python --version

    - name: Download Clang (r383902) & GCC 4.9
      run: |
        mkdir -p tc/clang
        mkdir -p tc/gcc
        mkdir -p tc/gcc32
        
        echo "Downloading Clang..."
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r3/clang-r383902.tar.gz
        tar -C tc/clang -zxf clang-r383902.tar.gz
        
        echo "Downloading GCC 4.9..."
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git tc/gcc
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git tc/gcc32

    - name: Setup Global PATH (Fix Compiler Not Found)
      # === 关键修复：将工具链路径写入 GitHub 全局变量 ===
      run: |
        echo "$GITHUB_WORKSPACE/tc/clang/bin" >> $GITHUB_PATH
        echo "$GITHUB_WORKSPACE/tc/gcc/bin" >> $GITHUB_PATH
        echo "$GITHUB_WORKSPACE/tc/gcc32/bin" >> $GITHUB_PATH

    - name: Integrate SukiSU (Non-GKI)
      run: |
        echo "Integrating SukiSU..."
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -
        
        # 检查集成情况
        if [ -d "drivers/kernelsu" ]; then
            echo "SukiSU integrated successfully!"
        else
            echo "Warning: SukiSU directory not found. Script might have failed or applied patches differently."
        fi

    - name: Configure Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        
        # 再次清理之前的残留，防止权限错误
        rm -rf out
        mkdir -p out
        
        # 生成 .config
        make O=out ${{ github.event.inputs.kernel_defconfig }} \
             CC=clang \
             CLANG_TRIPLE=aarch64-linux-gnu- \
             CROSS_COMPILE=aarch64-linux-android- \
             CROSS_COMPILE_ARM32=arm-linux-androideabi-

    - name: Modify Configs (Enable KSU/Kprobes)
      run: |
        echo "Modifying .config..."
        cd out
        # 使用 scripts/config 工具安全修改
        ../scripts/config --file .config --enable CONFIG_KPROBES
        ../scripts/config --file .config --enable CONFIG_HAVE_KPROBES
        ../scripts/config --file .config --enable CONFIG_KPROBE_EVENTS
        ../scripts/config --file .config --enable CONFIG_KSU
        
        # 关闭 LTO 防止老编译器报错
        ../scripts/config --file .config --disable CONFIG_LTO
        ../scripts/config --file .config --disable CONFIG_LTO_CLANG
        ../scripts/config --file .config --disable CONFIG_THIN_LTO
        cd ..

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        
        echo "Starting build..."
        make -j$(nproc --all) O=out \
             CC=clang \
             CLANG_TRIPLE=aarch64-linux-gnu- \
             CROSS_COMPILE=aarch64-linux-android- \
             CROSS_COMPILE_ARM32=arm-linux-androideabi- \
             Image.gz-dtb

    - name: Pack with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        rm -rf AnyKernel3/*.zip
        
        # 自动查找并复制编译出的 Image 文件
        if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "Found Image.gz"
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
        elif [ -f out/arch/arm64/boot/Image ]; then
            echo "Found Image"
            cp out/arch/arm64/boot/Image AnyKernel3/
        else
            echo "Error: No kernel image found in out/arch/arm64/boot/"
            exit 1
        fi
        
        # 适配 Find X2 机型名称
        cd AnyKernel3
        sed -i 's/device.name1=maguro/device.name1=OP5257/' anykernel.sh
        sed -i 's/device.name2=toro/device.name2=PDEM10/' anykernel.sh
        sed -i 's/device.name3=toroplus/device.name3=PDET10/' anykernel.sh
        sed -i 's/device.name4=tuna/device.name4=FindX2/' anykernel.sh
        
        zip -r9 SukiSU-Kernel-FindX2.zip * -x .git README.md *placeholder

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v3
      with:
        name: SukiSU-Kernel-FindX2
        path: AnyKernel3/SukiSU-Kernel-FindX2.zip
