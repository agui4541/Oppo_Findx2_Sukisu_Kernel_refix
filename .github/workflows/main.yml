name: Build oss-t kernel (SukiSU+SUSFS, AK3, no dtb/dtbo)

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "make -j"
        required: true
        default: "16"

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out
  DEFCONFIG: stock_defconfig

  # Toolchain (per upstream README suggestions)
  # NOTE: If this URL is not reachable for you, replace it with a pinned, known-good mirror of clang-r383902b1.
  CLANG_URL: "https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20231024/clang-r383902b1.tar.gz"
  GCC64_URL: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/archive/refs/heads/lineage-19.1.tar.gz"
  GCC32_URL: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9/archive/refs/heads/lineage-19.1.tar.gz"

  # AnyKernel3
  AK3_REPO: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache clang curl flex g++ gcc git \
            libelf-dev libssl-dev make ninja-build openssl python3 rsync unzip xz-utils zstd
          python3 -V
          git --version

      - name: Debug tree (ensure kernel root)
        shell: bash
        run: |
          set -euxo pipefail
          pwd
          ls -la
          test -d drivers
          test -d arch
          test -f arch/arm64/configs/${DEFCONFIG}

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Restore toolchains cache
        uses: actions/cache@v4
        with:
          path: toolchains
          key: toolchains-${{ runner.os }}-r383902b1-gcc49-v1

      - name: Fetch toolchains (clang-r383902b1 + gcc-4.9)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p toolchains
          cd toolchains

          if [[ ! -d clang-r383902b1 ]]; then
            echo "Fetching clang-r383902b1..."
            mkdir -p clang-r383902b1
            curl -L "${CLANG_URL}" -o clang.tar.gz
            tar -xf clang.tar.gz -C clang-r383902b1 --strip-components=1
            rm -f clang.tar.gz
          fi

          if [[ ! -d gcc64 ]]; then
            echo "Fetching gcc64 (aarch64-linux-android-4.9)..."
            curl -L "${GCC64_URL}" -o gcc64.tar.gz
            tar -xf gcc64.tar.gz
            mv android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9-* gcc64
            rm -f gcc64.tar.gz
          fi

          if [[ ! -d gcc32 ]]; then
            echo "Fetching gcc32 (arm-linux-androideabi-4.9)..."
            curl -L "${GCC32_URL}" -o gcc32.tar.gz
            tar -xf gcc32.tar.gz
            mv android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9-* gcc32
            rm -f gcc32.tar.gz
          fi

          echo "CLANG_PATH=$GITHUB_WORKSPACE/toolchains/clang-r383902b1/bin" >> "$GITHUB_ENV"
          echo "GCC64_PATH=$GITHUB_WORKSPACE/toolchains/gcc64/bin" >> "$GITHUB_ENV"
          echo "GCC32_PATH=$GITHUB_WORKSPACE/toolchains/gcc32/bin" >> "$GITHUB_ENV"

          echo "$GITHUB_WORKSPACE/toolchains/clang-r383902b1/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/toolchains/gcc64/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/toolchains/gcc32/bin" >> "$GITHUB_PATH"

          clang --version || true

      - name: Integrate SukiSU + SUSFS (susfs-main)
        shell: bash
        run: |
          set -euxo pipefail
          bash -c "$(curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh)" susfs-main 1

      - name: Configure kernel (stock_defconfig)
        shell: bash
        run: |
          set -euxo pipefail
          export ARCH="${ARCH}"

          export PATH="${CLANG_PATH}:${PATH}"
          export CC="clang"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="${GCC64_PATH}/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="${GCC32_PATH}/arm-linux-androideabi-"

          mkdir -p "${OUT_DIR}"
          make -C "$(pwd)" O="$(pwd)/${OUT_DIR}" \
            ARCH="${ARCH}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
            CC="${CC}" \
            "${DEFCONFIG}"

          make -C "$(pwd)" O="$(pwd)/${OUT_DIR}" \
            ARCH="${ARCH}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
            CC="${CC}" \
            olddefconfig

      - name: Build kernel
        shell: bash
        run: |
          set -euxo pipefail
          export ARCH="${ARCH}"

          export PATH="${CLANG_PATH}:${PATH}"
          export CC="clang"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="${GCC64_PATH}/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="${GCC32_PATH}/arm-linux-androideabi-"

          make -j"${{ inputs.jobs }}" -C "$(pwd)" O="$(pwd)/${OUT_DIR}" \
            ARCH="${ARCH}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
            CC="${CC}" \
            2>&1 | tee build.log

      - name: Collect raw kernel outputs (before packaging)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist/raw

          BOOT_DIR="${OUT_DIR}/arch/arm64/boot"
          test -d "${BOOT_DIR}"

          for f in Image Image.gz Image.gz-dtb; do
            if [[ -f "${BOOT_DIR}/${f}" ]]; then
              cp -v "${BOOT_DIR}/${f}" "dist/raw/${f}"
            fi
          done

          cp -v "${OUT_DIR}/.config" dist/raw/kernel.config
          cp -v build.log dist/raw/build.log

          {
            echo "repo: $GITHUB_REPOSITORY"
            echo "ref: $GITHUB_REF"
            echo "sha: $GITHUB_SHA"
            echo "date_utc: $(date -u +%F_%T)"
            echo "clang: $(clang --version | head -n 1 || true)"
          } | tee dist/raw/build-info.txt

          ls -la dist/raw

      - name: Upload raw artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_number }}
          path: dist/raw/*
          if-no-files-found: error

      - name: Prepare AnyKernel3 (AK3)
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf AnyKernel3
          git clone --depth=1 --branch "${AK3_BRANCH}" "${AK3_REPO}" AnyKernel3

          # Pick one kernel image to pack (prefer Image, then Image.gz, then Image.gz-dtb).
          KIMG=""
          for f in Image Image.gz Image.gz-dtb; do
            if [[ -f "dist/raw/${f}" ]]; then
              KIMG="dist/raw/${f}"
              break
            fi
          done

          if [[ -z "$KIMG" ]]; then
            echo "[ERROR] No kernel image found in dist/raw (Image/Image.gz/Image.gz-dtb)." >&2
            exit 1
          fi

          # Copy kernel into AK3 expected name: usually "Image"
          cp -v "$KIMG" AnyKernel3/Image

          # Do NOT include dtb/dtbo in the flashable zip.
          rm -f AnyKernel3/dtb AnyKernel3/dtb.img AnyKernel3/dtbo.img AnyKernel3/*.dtb AnyKernel3/*.dtbo || true

          cp -v dist/raw/build-info.txt AnyKernel3/build-info.txt
          cp -v dist/raw/kernel.config AnyKernel3/kernel.config

      - name: Create flashable zip (AK3, no dtb/dtbo)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist/ak3

          SHORT_SHA="${GITHUB_SHA:0:7}"
          ZIP_NAME="AK3-oss-t-sukisu-susfs-${{ github.run_number }}-${SHORT_SHA}.zip"

          (cd AnyKernel3 && zip -r9 "../dist/ak3/${ZIP_NAME}" . -x ".git/*" ".github/*")
          (cd dist/ak3 && sha256sum "${ZIP_NAME}" | tee "${ZIP_NAME}.sha256")

          ls -la dist/ak3

      - name: Upload AK3 zip
        uses: actions/upload-artifact@v4
        with:
          name: ak3-${{ github.run_number }}
          path: dist/ak3/*
          if-no-files-found: error
