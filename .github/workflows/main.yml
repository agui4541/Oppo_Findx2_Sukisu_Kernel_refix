name: Build Kernel (Final Fix)

on:
  workflow_dispatch:
    inputs:
      ksubranch:
        description: 'SukiSU Branch'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v3
      with:
        fetch-depth: 1

    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc curl git zip unzip libssl-dev libncurses5-dev python2
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: Download Toolchains
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchains
        cd $GITHUB_WORKSPACE/toolchains
        
        # Clang
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r3/clang-r383902.tar.gz
        mkdir clang-r383902
        tar -xzf clang-r383902.tar.gz -C clang-r383902
        
        # GCC
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git aarch64-linux-android-4.9
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git arm-linux-androideabi-4.9

    - name: Integrate SukiSU
      run: |
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${{ github.event.inputs.ksubranch }}/kernel/setup.sh" | bash -s nongki
        # 修复 Kconfig 语法
        sed -i '$a\' init/Kconfig

    - name: Fix Source Code Errors (Auto Patch)
      run: |
        echo "Patching Oplus RootGuard..."
        # 修复上一次报错的函数原型问题：将 () 替换为 (void)
        sed -i 's/static void __exit boot_state_exit()/static void __exit boot_state_exit(void)/' arch/arm64/kernel/rootguard/oplus_guard_general.c || true

    - name: Configure Kernel
      run: |
        TC_DIR=$GITHUB_WORKSPACE/toolchains
        export PATH=$TC_DIR/clang-r383902/bin:$TC_DIR/aarch64-linux-android-4.9/bin:$TC_DIR/arm-linux-androideabi-4.9/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=$TC_DIR/aarch64-linux-android-4.9/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$TC_DIR/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-
        export CC=clang
        
        mkdir -p out
        make O=out clean
        make O=out mrproper
        make O=out stock_defconfig
        
        # SukiSU 配置
        scripts/config --file out/.config --enable CONFIG_KSU
        scripts/config --file out/.config --enable CONFIG_KPROBES
        scripts/config --file out/.config --enable CONFIG_HAVE_KPROBES
        scripts/config --file out/.config --enable CONFIG_KPROBE_EVENTS
        scripts/config --file out/.config --disable CONFIG_LTO
        scripts/config --file out/.config --disable CONFIG_LTO_CLANG
        scripts/config --file out/.config --disable CONFIG_THIN_LTO

    - name: Build Kernel
      run: |
        TC_DIR=$GITHUB_WORKSPACE/toolchains
        export PATH=$TC_DIR/clang-r383902/bin:$TC_DIR/aarch64-linux-android-4.9/bin:$TC_DIR/arm-linux-androideabi-4.9/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=$TC_DIR/aarch64-linux-android-4.9/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$TC_DIR/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-
        export CC=clang
        
        # KCFLAGS=-w 极其重要：它会忽略所有警告，防止因 Warning 导致的编译失败
        make -j$(nproc --all) O=out KCFLAGS=-w Image

    - name: Package with AnyKernel3
      if: success()
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        if [ -f out/arch/arm64/boot/Image ]; then
          cp out/arch/arm64/boot/Image AnyKernel3/
        else
          echo "Error: Image not found"
          exit 1
        fi
        cd AnyKernel3
        rm -rf .git README.md
        sed -i 's/device.name1=maguro/device.name1=OP5257/' anykernel.sh
        sed -i 's/device.name2=toro/device.name2=PDEM10/' anykernel.sh
        zip -r9 ../Oppo_FindX2_SukiSU_Kernel.zip *

    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v4 # 升级到 v4
      with:
        name: Oppo_FindX2_SukiSU_Kernel
        path: Oppo_FindX2_SukiSU_Kernel.zip
