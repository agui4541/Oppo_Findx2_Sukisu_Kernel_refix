name: Build OPPO Find X2 Kernel (SukiSU + SUSFS)

on:
  workflow_dispatch:
    inputs:
      ksubranch:
        description: 'SukiSU Branch'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v3
      with:
        fetch-depth: 1

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc curl git zip unzip libssl-dev python2
        
        # 核心修复：将 python 指向 python2
        sudo ln -sf /usr/bin/python2 /usr/bin/python
        
        # 验证 python 版本
        python --version

    - name: Download Toolchains (AOSP Clang r383902 + GCC 4.9)
      run: |
        mkdir -p toolchains
        cd toolchains
        
        # 下载 AOSP Clang r383902 (Clang 11.0.1)
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r3/clang-r383902.tar.gz
        mkdir clang-r383902
        tar -xzf clang-r383902.tar.gz -C clang-r383902
        
        # 下载 GCC 4.9 (Google 预编译版)
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9

    - name: Integrate SukiSU
      run: |
        echo "Integrating SukiSU..."
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${{ github.event.inputs.ksubranch }}/kernel/setup.sh" | bash -s nongki
        
        # 修复可能的 Kconfig 换行问题
        # 有时脚本会在 EOF 后面直接追加内容导致语法错误
        # 这里尝试做一个简单的清理（可选，视情况而定）
        # sed -i '$a\' init/Kconfig

    - name: Integrate SUSFS (Manual Patch)
      run: |
        echo "Integrating SUSFS..."
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19
        
        # 复制文件
        cp susfs4ksu/kernel_patches/fs/* fs/
        cp susfs4ksu/kernel_patches/include/linux/* include/linux/
        
        # 手动 Patch (针对 4.19 非 GKI 的常见路径)
        # 注意：如果这里失败，不要惊慌，只要文件复制进去，并在 config 中开启了 SUSFS，
        # 有些功能可能无法完全隐藏，但基本能用。
        # 我们使用 patch 命令，如果失败则继续，避免中断
        patch -p1 < susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true

    - name: Configure Kernel
      run: |
        # 设置路径
        export PATH=$GITHUB_WORKSPACE/toolchains/clang-r383902/bin:$GITHUB_WORKSPACE/toolchains/aarch64-linux-android-4.9/bin:$GITHUB_WORKSPACE/toolchains/arm-linux-androideabi-4.9/bin:$PATH
        
        export ARCH=arm64
        export SUBARCH=arm64
        # 指定交叉编译器前缀
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        export CC=clang
        
        # 清理旧配置
        make O=out clean
        make O=out mrproper
        
        # 生成配置
        make O=out stock_defconfig
        
        # 强制追加 SukiSU 和 SUSFS 配置
        # 使用 scripts/config 工具更安全，或者直接追加到生成的 .config
        echo "CONFIG_KSU=y" >> out/.config
        echo "CONFIG_KSU_SUSFS=y" >> out/.config
        echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> out/.config
        # 确保 Kprobes 开启
        echo "CONFIG_KPROBES=y" >> out/.config
        echo "CONFIG_HAVE_KPROBES=y" >> out/.config
        echo "CONFIG_KPROBE_EVENTS=y" >> out/.config

    - name: Build Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/toolchains/clang-r383902/bin:$GITHUB_WORKSPACE/toolchains/aarch64-linux-android-4.9/bin:$GITHUB_WORKSPACE/toolchains/arm-linux-androideabi-4.9/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        export CC=clang
        
        # 再次确认 python 是 python2
        python --version
        
        # 开始编译 Image
        make -j$(nproc --all) O=out Image

    - name: Package with AnyKernel3
      if: success()
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        cp out/arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3
        rm -rf .git README.md
        zip -r9 ../Oppo_FindX2_SukiSU_Kernel.zip *

    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Oppo_FindX2_SukiSU_Kernel
        path: Oppo_FindX2_SukiSU_Kernel.zip
