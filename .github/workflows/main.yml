name: Build Kernel (Docker Container)

on:
  workflow_dispatch:
    inputs:
      ksubranch:
        description: 'SukiSU Branch'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-22.04
    # 核心：直接使用 Ubuntu 20.04 容器
    container:
      image: ubuntu:20.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v3
      with:
        fetch-depth: 1

    - name: Setup Build Environment (In Container)
      run: |
        # 容器内初始化
        apt-get update
        # 安装基础依赖
        # DEBIAN_FRONTEND=noninteractive 防止安装过程中弹出交互界面
        DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential bc curl git zip unzip \
            libssl-dev libncurses5-dev python2 kmod cpio \
            wget
        
        # 建立 Python 软链接
        ln -sf /usr/bin/python2 /usr/bin/python
        
        # 修复 Dash 问题 (OPPO Makefile 语法不兼容)
        # 在容器里，/bin/sh 默认指向 dash，强制改为 bash
        rm /bin/sh && ln -s /bin/bash /bin/sh

    - name: Download Toolchains
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchains
        cd $GITHUB_WORKSPACE/toolchains
        
        # 1. Clang r383902
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r3/clang-r383902.tar.gz
        mkdir clang-r383902
        tar -xzf clang-r383902.tar.gz -C clang-r383902
        
        # 2. GCC 4.9 (LineageOS 源)
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git aarch64-linux-android-4.9
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git arm-linux-androideabi-4.9

    - name: Integrate SukiSU
      run: |
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${{ github.event.inputs.ksubranch }}/kernel/setup.sh" | bash -s nongki
        sed -i '$a\' init/Kconfig

    - name: Fix Source Code Errors (Auto Patch)
      run: |
        # 1. TWA_RESUME 修复
        sed -i '1i #ifndef TWA_RESUME\n#define TWA_RESUME true\n#endif' drivers/kernelsu/allowlist.c
        
        # 2. 移除 MODULE_IMPORT_NS
        sed -i '/MODULE_IMPORT_NS/d' drivers/kernelsu/ksu.c || true

        # 3. 修复 Oplus RootGuard 函数原型
        if [ -f arch/arm64/kernel/rootguard/oplus_guard_general.c ]; then
            sed -i 's/static void __exit boot_state_exit()/static void __exit boot_state_exit(void)/' arch/arm64/kernel/rootguard/oplus_guard_general.c || true
        fi
        
        # 4. 去除 -Werror
        sed -i 's/-Werror/-Wno-error/g' Makefile
        if [ -f arch/arm64/Makefile ]; then sed -i 's/-Werror/-Wno-error/g' arch/arm64/Makefile; fi

    - name: Configure Kernel
      run: |
        TC_DIR=$GITHUB_WORKSPACE/toolchains
        export PATH=$TC_DIR/clang-r383902/bin:$TC_DIR/aarch64-linux-android-4.9/bin:$TC_DIR/arm-linux-androideabi-4.9/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        mkdir -p out
        make O=out clean
        make O=out mrproper
        
        make O=out stock_defconfig
        
        # SukiSU Configs
        scripts/config --file out/.config --enable CONFIG_KSU
        scripts/config --file out/.config --enable CONFIG_KPROBES
        scripts/config --file out/.config --enable CONFIG_HAVE_KPROBES
        scripts/config --file out/.config --enable CONFIG_KPROBE_EVENTS
        scripts/config --file out/.config --disable CONFIG_LTO
        scripts/config --file out/.config --disable CONFIG_LTO_CLANG
        scripts/config --file out/.config --disable CONFIG_THIN_LTO
        scripts/config --file out/.config --disable CONFIG_WERROR

    - name: Build Kernel
      run: |
        TC_DIR=$GITHUB_WORKSPACE/toolchains
        export PATH=$TC_DIR/clang-r383902/bin:$TC_DIR/aarch64-linux-android-4.9/bin:$TC_DIR/arm-linux-androideabi-4.9/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        # 获取 CPU 核心数 (容器内 nproc 可能不准确，直接指定一个保守值或用 shell 获取)
        CORES=$(grep -c ^processor /proc/cpuinfo)
        
        make -j$CORES O=out \
             KCFLAGS="-w -DMODULE_IMPORT_NS(x)= -DTWA_RESUME=1" \
             KBUILD_CFLAGS+="-Wno-error" \
             Image.gz-dtb

    # === Checkpoint ===
    - name: Upload Raw Kernel Image
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Image-Only-Backup
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/Image.gz
          out/arch/arm64/boot/Image.gz-dtb

    - name: Package with AnyKernel3
      if: success()
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        elif [ -f out/arch/arm64/boot/Image.gz ]; then
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
        elif [ -f out/arch/arm64/boot/Image ]; then
          cp out/arch/arm64/boot/Image AnyKernel3/
        else
          echo "Error: Image not found"
          exit 1
        fi
        cd AnyKernel3
        rm -rf .git README.md
        sed -i 's/device.name1=maguro/device.name1=OP5257/' anykernel.sh
        sed -i 's/device.name2=toro/device.name2=PDEM10/' anykernel.sh
        sed -i 's/device.name3=toroplus/device.name3=PDET10/' anykernel.sh
        sed -i 's/device.name4=tuna/device.name4=FindX2/' anykernel.sh
        zip -r9 ../Oppo_FindX2_SukiSU_Kernel.zip *

    - name: Upload Final Zip
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Oppo_FindX2_SukiSU_Kernel
        path: Oppo_FindX2_SukiSU_Kernel.zip
