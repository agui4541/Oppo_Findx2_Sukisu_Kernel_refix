name: Build kernel (oss-t, SukiSU+SUSFS, raw outputs)

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Parallel jobs (make -jN)"
        required: true
        default: "16"
      sukisu_branch:
        description: "SukiSU-Ultra branch (usually main)"
        required: true
        default: "main"

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out
  DEFCONFIG: stock_defconfig

  AOSP_CLANG_URL: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r3/clang-r383902.tar.gz"
  GCC64_REPO: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
  GCC32_REPO: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex \
            ca-certificates curl file git unzip zip rsync \
            libssl-dev libelf-dev libncurses5-dev \
            python2 python3 \
            openssl \
            xz-utils zstd lz4 \
            ccache
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          python -V
          python2 -V
          git --version
          ccache --version

      - name: Verify kernel tree layout
        shell: bash
        run: |
          set -euxo pipefail
          pwd
          test -d drivers
          test -d arch
          test -f "arch/arm64/configs/${DEFCONFIG}"
          echo "[OK] kernel root + defconfig OK"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: toolchains
          key: toolchains-${{ runner.os }}-aosp-clang-r383902-gcc49-v3

      - name: Download toolchains (AOSP clang-r383902 + GCC 4.9)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/toolchains"
          cd "$GITHUB_WORKSPACE/toolchains"

          if [[ ! -d clang-r383902 ]]; then
            echo "Downloading AOSP clang-r383902..."
            http_code="$(curl -L -sS -w "%{http_code}" -o clang-r383902.tar.gz "${AOSP_CLANG_URL}" || true)"
            echo "HTTP: $http_code"
            ls -lh clang-r383902.tar.gz || true

            if [[ "$http_code" != "200" ]]; then
              echo "[ERROR] clang download failed (HTTP $http_code). First 200 bytes:"
              head -c 200 clang-r383902.tar.gz || true
              echo
              exit 1
            fi

            # Validate gzip (fails if it's actually HTML/text)
            gzip -t clang-r383902.tar.gz

            mkdir -p clang-r383902
            tar -xzf clang-r383902.tar.gz -C clang-r383902
            rm -f clang-r383902.tar.gz
          fi

          if [[ ! -d aarch64-linux-android-4.9 ]]; then
            git clone --depth=1 "${GCC64_REPO}" aarch64-linux-android-4.9
          fi
          if [[ ! -d arm-linux-androideabi-4.9 ]]; then
            git clone --depth=1 "${GCC32_REPO}" arm-linux-androideabi-4.9
          fi

          echo "CLANG_BIN=$GITHUB_WORKSPACE/toolchains/clang-r383902/bin" >> "$GITHUB_ENV"
          echo "GCC64_PREFIX=$GITHUB_WORKSPACE/toolchains/aarch64-linux-android-4.9/bin/aarch64-linux-android-" >> "$GITHUB_ENV"
          echo "GCC32_PREFIX=$GITHUB_WORKSPACE/toolchains/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-" >> "$GITHUB_ENV"

          echo "$GITHUB_WORKSPACE/toolchains/clang-r383902/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/toolchains/aarch64-linux-android-4.9/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/toolchains/arm-linux-androideabi-4.9/bin" >> "$GITHUB_PATH"

          "$GITHUB_WORKSPACE/toolchains/clang-r383902/bin/clang" --version
          "${GCC64_PREFIX}gcc" --version | head -n 1
          "${GCC32_PREFIX}gcc" --version | head -n 1

      - name: Clean output dir (mrproper)
        shell: bash
        run: |
          set -euxo pipefail
          make O="${OUT_DIR}" mrproper
          mkdir -p "${OUT_DIR}"

      - name: Integrate SukiSU + SUSFS
        shell: bash
        run: |
          set -euxo pipefail
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${{ inputs.sukisu_branch }}/kernel/setup.sh" | bash -s susfs-main 1

      - name: Verify integration result (quick checks)
        shell: bash
        run: |
          set -euxo pipefail
          echo "Git status after integration:"
          git status --porcelain || true
          echo "Look for KernelSU/SukiSU driver dir (best-effort):"
          ls -la drivers | head -n 200 || true
          find drivers -maxdepth 3 -type d \( -iname "*kernelsu*" -o -iname "*sukisu*" -o -iname "*ksu*" \) -print || true

      - name: Configure kernel (stock_defconfig)
        shell: bash
        run: |
          set -euxo pipefail
          export ARCH="${ARCH}"
          export SUBARCH="${SUBARCH}"

          # Enable ccache wrappers (Ubuntu)
          export PATH="/usr/lib/ccache:${PATH}"

          export PATH="${CLANG_BIN}:${PATH}"
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="${GCC64_PREFIX}"
          export CROSS_COMPILE_ARM32="${GCC32_PREFIX}"

          make O="${OUT_DIR}" "${DEFCONFIG}"

          # Best-effort stability toggles
          if [[ -x scripts/config ]]; then
            scripts/config --file "${OUT_DIR}/.config" -d LTO -d LTO_CLANG -d THINLTO || true
            scripts/config --file "${OUT_DIR}/.config" -d WERROR || true
          fi

          make O="${OUT_DIR}" olddefconfig

          echo "=== Key config checks ==="
          grep -E "CONFIG_(KPROBES|KALLSYMS|KSU|KPM|SUSFS)=" "${OUT_DIR}/.config" || true

      - name: Build kernel (Image, plus optional Image.gz)
        shell: bash
        run: |
          set -euxo pipefail
          export ARCH="${ARCH}"
          export SUBARCH="${SUBARCH}"

          export PATH="/usr/lib/ccache:${PATH}"

          export PATH="${CLANG_BIN}:${PATH}"
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="${GCC64_PREFIX}"
          export CROSS_COMPILE_ARM32="${GCC32_PREFIX}"

          ccache -z || true

          make -j"${{ inputs.jobs }}" O="${OUT_DIR}" Image 2>&1 | tee build.log
          make -j"${{ inputs.jobs }}" O="${OUT_DIR}" Image.gz 2>&1 | tee -a build.log || true

          ccache -s || true

      - name: Collect artifacts (raw outputs)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist

          BOOT_DIR="${OUT_DIR}/arch/arm64/boot"
          test -d "${BOOT_DIR}"

          if [[ ! -f "${BOOT_DIR}/Image" ]]; then
            echo "[ERROR] out/arch/arm64/boot/Image not found." >&2
            echo "Available files under boot dir:" >&2
            ls -la "${BOOT_DIR}" >&2 || true
            exit 1
          fi

          cp -v "${BOOT_DIR}/Image" dist/Image

          # Optional
          for f in Image.gz Image.gz-dtb Image.lz4 Image.lz4-dtb; do
            if [[ -f "${BOOT_DIR}/${f}" ]]; then
              cp -v "${BOOT_DIR}/${f}" "dist/${f}"
            fi
          done

          # Debug-friendly
          [[ -f "${OUT_DIR}/vmlinux" ]] && cp -v "${OUT_DIR}/vmlinux" dist/vmlinux || true
          [[ -f "${OUT_DIR}/System.map" ]] && cp -v "${OUT_DIR}/System.map" dist/System.map || true

          cp -v "${OUT_DIR}/.config" dist/kernel.config
          cp -v build.log dist/build.log

          {
            echo "repo: $GITHUB_REPOSITORY"
            echo "ref: $GITHUB_REF"
            echo "sha: $GITHUB_SHA"
            echo "date_utc: $(date -u +%F_%T)"
            echo "clang: $(clang --version | head -n 1 || true)"
            echo "gcc64: $(${GCC64_PREFIX}gcc --version | head -n 1 || true)"
          } | tee dist/build-info.txt

          ls -la dist

      - name: Upload raw kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-raw-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
