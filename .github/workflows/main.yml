name: Build Kernel (Proton Clang Fix)

on:
  workflow_dispatch:
    inputs:
      ksubranch:
        description: 'SukiSU Branch'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v3
      with:
        fetch-depth: 1

    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc curl git zip unzip libssl-dev libncurses5-dev python2
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: Download Proton Clang 13
      run: |
        # Proton Clang 自带了完整的工具链，但前缀是 gnu-
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: Integrate SukiSU
      run: |
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${{ github.event.inputs.ksubranch }}/kernel/setup.sh" | bash -s nongki
        
        # 修复 Kconfig 语法 (防止追加内容时未换行)
        sed -i '$a\' init/Kconfig

    - name: Fix Source Code Errors (Auto Patch)
      run: |
        echo "Applying auto-patches..."
        
        # 1. 修复 TWA_RESUME 兼容性 (4.19 内核没有这个宏)
        sed -i '1i #ifndef TWA_RESUME\n#define TWA_RESUME true\n#endif' drivers/kernelsu/allowlist.c
        
        # 2. 移除 4.19 不支持的 MODULE_IMPORT_NS
        sed -i '/MODULE_IMPORT_NS/d' drivers/kernelsu/ksu.c || true

        # 3. 修复 Oplus RootGuard 函数原型
        if [ -f arch/arm64/kernel/rootguard/oplus_guard_general.c ]; then
            sed -i 's/static void __exit boot_state_exit()/static void __exit boot_state_exit(void)/' arch/arm64/kernel/rootguard/oplus_guard_general.c || true
        fi
        
        # 4. 暴力去除 Makefile 中的 -Werror
        sed -i 's/-Werror/-Wno-error/g' Makefile
        if [ -f arch/arm64/Makefile ]; then sed -i 's/-Werror/-Wno-error/g' arch/arm64/Makefile; fi

    - name: Configure Kernel
      run: |
        # 设置 PATH 指向 Proton Clang
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        
        # === 核心修正 ===
        # Proton Clang 的二进制文件是 aarch64-linux-gnu-gcc，不是 android-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        mkdir -p out
        make O=out clean
        make O=out mrproper
        
        make O=out stock_defconfig
        
        # SukiSU Configs
        scripts/config --file out/.config --enable CONFIG_KSU
        scripts/config --file out/.config --enable CONFIG_KPROBES
        scripts/config --file out/.config --enable CONFIG_HAVE_KPROBES
        scripts/config --file out/.config --enable CONFIG_KPROBE_EVENTS
        scripts/config --file out/.config --disable CONFIG_LTO
        scripts/config --file out/.config --disable CONFIG_LTO_CLANG
        scripts/config --file out/.config --disable CONFIG_THIN_LTO

    - name: Build Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        
        # === 核心修正 ===
        # 使用 gnu- 前缀
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # -w: 忽略警告
        make -j$(nproc --all) O=out \
             KCFLAGS="-w -DMODULE_IMPORT_NS(x)=" \
             KBUILD_CFLAGS+="-Wno-error" \
             Image.gz-dtb

    # === 检查点：编译完成立即上传 ===
    - name: CHECKPOINT - Upload Compiled Image
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Image-Checkpoint
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/Image.gz
          out/arch/arm64/boot/Image.gz-dtb

    - name: Package with AnyKernel3
      if: success()
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        
        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        elif [ -f out/arch/arm64/boot/Image.gz ]; then
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
        elif [ -f out/arch/arm64/boot/Image ]; then
          cp out/arch/arm64/boot/Image AnyKernel3/
        else
          echo "Error: Image not found"
          exit 1
        fi
        
        cd AnyKernel3
        rm -rf .git README.md
        sed -i 's/device.name1=maguro/device.name1=OP5257/' anykernel.sh
        sed -i 's/device.name2=toro/device.name2=PDEM10/' anykernel.sh
        sed -i 's/device.name3=toroplus/device.name3=PDET10/' anykernel.sh
        sed -i 's/device.name4=tuna/device.name4=FindX2/' anykernel.sh
        
        zip -r9 ../Oppo_FindX2_SukiSU_Kernel.zip *

    - name: Upload Final Zip
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Oppo_FindX2_SukiSU_Kernel
        path: Oppo_FindX2_SukiSU_Kernel.zip
