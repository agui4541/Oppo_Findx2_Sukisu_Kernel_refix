name: Build OPPO Find X2 Kernel (SukiSU + SUSFS)

on:
  workflow_dispatch:
    inputs:
      # 允许你在手动运行时修改这些参数
      ksubranch:
        description: 'SukiSU 分支 (默认 main)'
        required: true
        default: 'main'
      susfs_version:
        description: 'SUSFS 版本 (默认 v1.5.5)'
        required: true
        default: 'v1.5.5'

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Kernel Source (获取内核源码)
      uses: actions/checkout@v3
      with:
        fetch-depth: 1

    - name: Setup Build Environment (安装编译依赖)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc curl git zip unzip libssl-dev python3 python2
        sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Download Clang Toolchain (下载编译器)
      run: |
        # 下载 Proton Clang 13 (稳定且适合骁龙865 4.19内核)
        mkdir -p clang
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: Integrate SukiSU (集成 SukiSU)
      run: |
        echo "正在集成 SukiSU..."
        # 使用官方脚本集成非 GKI 版本的 SukiSU
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${{ github.event.inputs.ksubranch }}/kernel/setup.sh" | bash -s nongki
        
        # 确保配置已开启
        echo "CONFIG_KSU=y" >> arch/arm64/configs/stock_defconfig
        echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/stock_defconfig

    - name: Integrate SUSFS (集成 SUSFS)
      run: |
        echo "正在尝试集成 SUSFS..."
        # 克隆 SUSFS 仓库
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19
        
        # 复制 SUSFS 核心文件到内核源码
        # 注意：这里是根据通用的 4.19 结构复制，OPPO 源码结构通常标准
        cp susfs4ksu/kernel_patches/fs/* fs/
        cp susfs4ksu/kernel_patches/include/linux/* include/linux/
        
        # 应用 patch (如果 patch 失败不会停止，防止因为小冲突导致整个编译挂掉)
        # 你可以在 Actions 日志中查看这一步是否成功
        if [ -f "susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch" ]; then
          patch -p1 < susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || echo "Patch 应用失败，可能需要手动解决冲突，但我们将尝试继续编译..."
        fi

    - name: Configure Kernel (配置内核)
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        
        # 使用你指定的 stock_defconfig
        make O=out stock_defconfig

    - name: Build Kernel (开始编译)
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        # 编译 Image (不编译 dtbo，只编译内核镜像)
        # -j$(nproc --all) 使用所有 CPU 核心
        make -j$(nproc --all) O=out Image

    - name: Package with AnyKernel3 (打包)
      run: |
        # 克隆 AnyKernel3
        git clone https://github.com/osm0sis/AnyKernel3.git
        
        # 将编译好的 Image 复制进去
        cp out/arch/arm64/boot/Image AnyKernel3/
        
        # 修改 AnyKernel3 的脚本以适配机型 (简单适配)
        # 这里假设你的设备代号在 build.prop 中包含 oppo 或 PDM 等标识，AK3通常能自动识别
        # 但为了保险，我们不修改 device check，直接打包
        
        cd AnyKernel3
        # 清理无用文件
        rm -rf .git README.md
        
        # 打包
        zip -r9 ../Oppo_FindX2_SukiSU_Kernel.zip *

    - name: Upload Artifact (上传结果)
      uses: actions/upload-artifact@v4
      with:
        name: Oppo_FindX2_SukiSU_Kernel
        path: Oppo_FindX2_SukiSU_Kernel.zip
