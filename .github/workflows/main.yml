name: Build Kernel (SukiSU 4.19 Fix)

on:
  workflow_dispatch:
    inputs:
      ksubranch:
        description: 'SukiSU Branch'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v3
      with:
        fetch-depth: 1

    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc curl git zip unzip libssl-dev libncurses5-dev python2
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: Download Toolchains (Clang 12 + GCC)
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchains
        cd $GITHUB_WORKSPACE/toolchains
        
        # 使用 Clang 12 (最稳妥的选择)
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r32/clang-r416183b.tar.gz
        mkdir clang-12
        tar -xzf clang-r416183b.tar.gz -C clang-12
        
        # GCC 4.9
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git aarch64-linux-android-4.9
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git arm-linux-androideabi-4.9

    - name: Integrate SukiSU
      run: |
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${{ github.event.inputs.ksubranch }}/kernel/setup.sh" | bash -s nongki
        sed -i '$a\' init/Kconfig

    - name: Fix Source Code Errors (Crucial Steps)
      run: |
        # 1. 修复 Oplus RootGuard 函数原型 (void)
        if [ -f arch/arm64/kernel/rootguard/oplus_guard_general.c ]; then
            sed -i 's/static void __exit boot_state_exit()/static void __exit boot_state_exit(void)/' arch/arm64/kernel/rootguard/oplus_guard_general.c || true
        fi

        # 2. 【新增修复】移除 4.19 不支持的 MODULE_IMPORT_NS
        # 这行代码在非 GKI 内核上是多余的，且会导致编译失败
        sed -i '/MODULE_IMPORT_NS/d' drivers/kernelsu/ksu.c || true

    - name: Configure Kernel
      run: |
        TC_DIR=$GITHUB_WORKSPACE/toolchains
        export PATH=$TC_DIR/clang-12/bin:$TC_DIR/aarch64-linux-android-4.9/bin:$TC_DIR/arm-linux-androideabi-4.9/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        
        mkdir -p out
        make O=out clean
        make O=out mrproper
        
        make O=out stock_defconfig \
             CC="clang" \
             CLANG_TRIPLE=aarch64-linux-gnu- \
             CROSS_COMPILE=aarch64-linux-android- \
             CROSS_COMPILE_ARM32=arm-linux-androideabi-
        
        # SukiSU Config
        scripts/config --file out/.config --enable CONFIG_KSU
        scripts/config --file out/.config --enable CONFIG_KPROBES
        scripts/config --file out/.config --enable CONFIG_HAVE_KPROBES
        scripts/config --file out/.config --enable CONFIG_KPROBE_EVENTS
        scripts/config --file out/.config --disable CONFIG_LTO
        scripts/config --file out/.config --disable CONFIG_LTO_CLANG
        scripts/config --file out/.config --disable CONFIG_THIN_LTO
        scripts/config --file out/.config --disable CONFIG_WERROR

    - name: Build Kernel
      run: |
        TC_DIR=$GITHUB_WORKSPACE/toolchains
        export PATH=$TC_DIR/clang-12/bin:$TC_DIR/aarch64-linux-android-4.9/bin:$TC_DIR/arm-linux-androideabi-4.9/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        
        # 使用 --target 强制指定架构，KCFLAGS=-w 忽略警告
        make -j$(nproc --all) O=out \
             CC="clang --target=aarch64-linux-gnu" \
             CLANG_TRIPLE=aarch64-linux-gnu- \
             CROSS_COMPILE=aarch64-linux-android- \
             CROSS_COMPILE_ARM32=arm-linux-androideabi- \
             KCFLAGS=-w \
             Image

    # === 检查点 1：编译完成立即上传 Image ===
    - name: Upload Raw Kernel Image
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Image-Only-Backup
        path: out/arch/arm64/boot/Image

    - name: Package with AnyKernel3
      if: success()
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        if [ -f out/arch/arm64/boot/Image ]; then
          cp out/arch/arm64/boot/Image AnyKernel3/
        else
          echo "Error: Image not found"
          exit 1
        fi
        cd AnyKernel3
        rm -rf .git README.md
        sed -i 's/device.name1=maguro/device.name1=OP5257/' anykernel.sh
        sed -i 's/device.name2=toro/device.name2=PDEM10/' anykernel.sh
        zip -r9 ../Oppo_FindX2_SukiSU_Kernel.zip *

    # === 检查点 2：最终成品上传 ===
    - name: Upload Flashable Zip
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Oppo_FindX2_SukiSU_Flashable
        path: Oppo_FindX2_SukiSU_Kernel.zip
